<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: system-ui, sans-serif;
            width: 90vw; /* Largeur relative à la fenêtre */
            max-width: 300px; /* Largeur maximale pour éviter un étirement trop large */
            padding: 12px;
            margin: 0 auto; /* Centre le contenu horizontalement */
            text-align: center;
            box-sizing: border-box; /* Inclut le padding dans la largeur totale */
        }
        .status {
            color: #0f9d58;
            font-weight: bold;
        }
        h3 {
            margin: 0 0 8px 0; /* Réduit l'espace sous le titre */
            font-size: 1.2em; /* Taille de police adaptée */
        }
        p {
            margin: 8px 0; /* Espacement vertical */
        }
        small {
            color: #666;
            font-size: 0.8em; /* Taille de police réduite pour la version */
        }
    </style>
</head>
<body>
    <h3>IA Overview disabler</h3>
    <p>Status: <span class="status">Active</span></p>
    <small>v1.0.3</small>
</body>
</html>
