<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #238636; /* Vert terminal / LED */
            --accent-glow: rgba(35, 134, 54, 0.15);
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            width: 260px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            border: 1px solid var(--border);
        }

        h3 {
            margin: 0 0 14px 0;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--accent);
            text-align: left;
            letter-spacing: -0.2px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .toggle-label {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text);
        }

        /* Switch Rétro-Futuriste (Angles droits style terminal) */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg);
            border: 1px solid var(--border);
            transition: background-color .2s, border-color .2s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: transform .2s, background-color .2s;
        }

        input:checked + .slider {
            background-color: var(--accent-glow);
            border-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
            background-color: var(--accent);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        small {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
            text-align: right;
        }

        .popup-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .changelog-link {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .changelog-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h3>[ IA Block ]</h3>
    
    <div class="toggle-container">
        <span class="toggle-label">Activate</span>
        <label class="switch">
            <input type="checkbox" id="toggleState" checked>
            <span class="slider"></span>
        </label>
    </div>

    <small>v1.1.6</small>

    <div class="popup-footer">
        <a href="https://denispellon.github.io/ai-block-firefox/" class="changelog-link" target="_blank" rel="noopener">
            &gt; Informations
        </a>
    </div>

    <!-- External JS for CSP -->
    <script src="popup.js"></script>
</body>
</html>
